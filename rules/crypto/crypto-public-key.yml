rules:
  - id: crypto-public-key
    languages: [python]
    severity: INFO
    message: Public-key algorithm in use.
    metadata:
      asset: public_key
    pattern-either:
      # cryptography
      - pattern: rsa.generate_private_key(..., key_size=$SIZE, ...)
      - pattern: dsa.generate_private_key(key_size=$SIZE, ...)
      - pattern: dsa.generate_private_key($SIZE, ...)
      - pattern: ec.generate_private_key($CURVE, ...)
      - pattern: dh.generate_parameters(..., key_size=$SIZE, ...)
      - pattern: ed25519.Ed25519PrivateKey.generate()
      - pattern: ed448.Ed448PrivateKey.generate()
      - pattern: x25519.X25519PrivateKey.generate()
      - pattern: x448.X448PrivateKey.generate()
      # PyCryptodome
      - pattern: RSA.generate($SIZE, ...)
      - pattern: DSA.generate($SIZE, ...)
      - pattern: ECC.generate(curve=$CURVE, ...)
