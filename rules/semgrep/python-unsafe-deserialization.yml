rules:
  - id: python-unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: Data is deserialized with a loader that can execute code.
    metadata:
      owasp: A08
      cwe: CWE-502
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: cPickle.loads(...)
      - pattern: marshal.loads(...)
      - pattern: shelve.open(...)
      # yaml.load is only unsafe without a safe loader
      - patterns:
          - pattern: yaml.load(...)
          - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
          - pattern-not: yaml.load(..., Loader=yaml.CSafeLoader, ...)
          - pattern-not: yaml.load(..., Loader=SafeLoader, ...)
      - pattern: yaml.unsafe_load(...)
