rules:
  - id: python-code-injection
    languages: [python]
    severity: ERROR
    message: A request input is evaluated as Python code.
    metadata:
      owasp: A03
      cwe: CWE-95
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              @$ROUTER.$METHOD(...)
              def $HANDLER(..., $PARAM, ...):
                  ...
          - pattern: $PARAM
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($CODE, ...)
              - pattern: exec($CODE, ...)
              - pattern: compile($CODE, ...)
          - focus-metavariable: $CODE
