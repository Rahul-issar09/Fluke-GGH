rules:
  - id: js-path-traversal
    languages: [javascript, typescript]
    severity: ERROR
    message: A request input decides which file the server reads or sends (path traversal).
    metadata:
      owasp: A01
      cwe: CWE-22
    mode: taint
    # Express request input: query string, path parameters, body, headers, cookies
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.query.$X
              - pattern: $REQ.params.$X
              - pattern: $REQ.body.$X
              - pattern: $REQ.get(...)
              - pattern: $REQ.param(...)
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.sendFile($P)
              - pattern: $RES.download($P, ...)
              - pattern: fs.readFile($P, ...)
              - pattern: fs.readFileSync($P, ...)
              - pattern: fs.createReadStream($P, ...)
              - pattern: fs.promises.readFile($P, ...)
              - pattern: readFile($P, ...)
              - pattern: readFileSync($P, ...)
          - focus-metavariable: $P
    # path.basename() keeps only the file name
    pattern-sanitizers:
      - pattern: path.basename(...)
      - pattern: basename(...)
